[package]
name = "agent-allowance"
description = "Protocol-enforced spending guardrails for AI agents on NEAR"
version = "1.0.0"
edition = "2021"
rust-version = "1.93"
license = "MIT"
repository = "https://github.com/abdulrr25/Agent_Allowance"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30.1"

[dev-dependencies]
near-sdk = { version = "5.30.1", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
